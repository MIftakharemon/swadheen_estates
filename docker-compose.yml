services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: swadheen
      POSTGRES_PASSWORD: change-me-local-only
      POSTGRES_DB: swadheen_estates
    ports:
      - '5432:5432'
    volumes:
      - swadheen-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swadheen -d swadheen_estates']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  swadheen-postgres:
